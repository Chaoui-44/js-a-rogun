<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visite Énergie</title>
<meta name="description" content="Carnet de visite et avis énergétique indicatif pour acheteurs de maisons">
<meta name="theme-color" content="#0F4C5C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visite Énergie">
<style>
/* ===== Design system : rénovation / énergie / confiance =====
   Clair et très contrasté (lisible en plein soleil), teal profond = confiance,
   ambre = énergie / action principale. Polices système (fonctionne hors ligne). */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#0F172A; --ink-2:#334155; --muted:#475569;
  --line:#CBD5E1; --line-strong:#64748B;
  --brand:#0F4C5C; --brand-hover:#0A3945; --brand-ink:#FFFFFF; --brand-tint:#E3F1F3;
  --accent:#F5B301; --accent-hover:#E0A200; --accent-ink:#1A1300;
  --ok:#14532D; --ok-bg:#DCFCE7; --warn:#7C2D12; --warn-bg:#FFEDD5;
  --bad:#991B1B; --bad-bg:#FEE2E2; --info:#1E3A8A; --info-bg:#DBEAFE;
  --rec:#B91C1C; --rec-ink:#FFFFFF;
  --focus:#0B5FFF; --r:14px; --tap:52px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-tap-highlight-color:transparent}
h1,h2,h3{line-height:1.25;margin:0}
h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0 0 .6em}
a{color:var(--brand)}
button,select,input,textarea{font:inherit;color:inherit}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---- Barre haute ---- */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:64px;padding:6px 12px}
.top h1{flex:1;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-mark{width:40px;height:40px;flex:none;border-radius:10px;overflow:hidden;background:#fff}
.brand-mark img,.brand-mark svg{width:100%;height:100%;object-fit:contain;display:block}
.ibtn{width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;border:0;color:inherit;text-decoration:none;cursor:pointer;transition:background .15s}
.ibtn:hover{background:rgba(255,255,255,.18)}
.savest{font-size:.8rem;opacity:.95;white-space:nowrap}
.offpill{background:var(--accent);color:var(--accent-ink);font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}

/* ---- Boutons & champs ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--tap);padding:10px 20px;border-radius:var(--r);border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s,transform .05s}
.btn:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--surface);color:var(--brand)} .btn.alt:hover{background:var(--brand-tint)}
.btn.cta{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.cta:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)} .btn.danger:hover{background:var(--bad-bg)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.95rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
label.f{display:block;font-weight:600;margin:0 0 14px;color:var(--ink-2)}
label.f>span{display:block;margin-bottom:4px;font-size:.93rem}
.inp{width:100%;min-height:var(--tap);padding:10px 12px;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:400}
.inp:hover{border-color:var(--ink-2)}
select.inp{cursor:pointer}
textarea.inp{min-height:130px;resize:vertical;line-height:1.5}
.inp.num{text-align:right}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--brand);cursor:pointer;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.hint{color:var(--muted);font-size:.93rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-flex;align-items:center;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--brand-tint);color:var(--brand);white-space:nowrap}
.pill.urgent{background:var(--bad-bg);color:var(--bad)} .pill.important{background:var(--warn-bg);color:var(--warn)}
.pill.confort{background:var(--ok-bg);color:var(--ok)} .pill.non_evalue{background:#E2E8F0;color:var(--ink-2)}
.pill.info{background:var(--info-bg);color:var(--info)}

/* ---- Accueil ---- */
.sumbar{display:flex;gap:12px;margin-bottom:14px}
.sumbar>div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sumbar b{display:block;font-size:1.4rem}
.list{display:grid;gap:12px;grid-template-columns:1fr;padding-bottom:96px}
.visit{display:block;text-decoration:none;color:inherit;margin:0;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.visit:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(15,76,92,.15)}
.visit strong{display:block;font-size:1.1rem;margin-bottom:2px}
.empty{text-align:center;padding:36px 16px}
.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:10}
.fab .btn{max-width:520px;margin:0 auto;min-height:60px;font-size:1.1rem;box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* ---- Onglets ---- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#E2E8F0;padding:5px;border-radius:var(--r);margin-bottom:14px}
.tab{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background .15s}
.tab:hover{background:rgba(255,255,255,.7)}
.tab[aria-selected=true]{background:var(--surface);color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ---- Visite : pièces ---- */
.rooms{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px 6px;padding-inline:16px;scrollbar-width:thin}
.chip{position:relative;flex:none;min-height:48px;padding:6px 16px;border-radius:99px;border:2px solid var(--line-strong);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.chip:hover{background:var(--brand-tint)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);border:1px solid var(--accent-ink)}
.room-main{min-width:0}
.micstate{min-height:1.6em;font-weight:600;color:var(--ink-2)}
.micstate.live{color:var(--rec)}
.interim{color:var(--muted);font-style:italic;min-height:1.4em;margin:4px 0 12px}
.phgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.ph{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#E2E8F0}
.phbar{display:flex;gap:4px;align-items:center;padding:6px}
.phbar .inp{min-height:44px;padding:6px 8px;font-size:.93rem}
.dock{position:sticky;bottom:0;z-index:15;margin:18px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:2px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.12);display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.dock .btn{min-height:68px;flex-direction:column;gap:2px;font-size:.9rem;padding:6px 8px}
.mic{width:92px;height:92px;border-radius:50%;border:4px solid var(--accent-ink);background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;cursor:pointer;position:relative;transition:background .15s,transform .05s}
.mic .ic{width:38px;height:38px}
.mic:hover{background:var(--accent-hover)} .mic:active{transform:scale(.96)}
.mic[aria-pressed=true]{background:var(--rec);color:var(--rec-ink);border-color:#450A0A}
.mic[aria-pressed=true]::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--rec);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.15);opacity:0}}

/* ---- Diagnostic ---- */
.disc{background:var(--warn-bg);color:var(--warn);border:2px solid #FDBA74;border-radius:var(--r);padding:12px 14px;font-weight:600;margin-bottom:14px}
.err{background:var(--bad-bg);color:var(--bad);border:2px solid #FCA5A5;border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-weight:600}
.busy{display:flex;align-items:center;gap:12px;font-weight:600}
.spin{width:28px;height:28px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:rot 1s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
details.poste{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
details.poste>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;min-height:var(--tap);border-radius:var(--r);transition:background .15s}
details.poste>summary::-webkit-details-marker{display:none}
details.poste>summary:hover{background:var(--brand-tint)}
details.poste>summary b{flex:1 1 150px}
.pbody{padding:2px 16px 16px;border-top:1px solid var(--line)}
.pbody label.f{margin-top:12px}
.chk{display:flex;gap:12px;align-items:center;font-weight:600;min-height:var(--tap);cursor:pointer}
.big{font-size:1.5rem;font-weight:800;color:var(--brand)}
table.t{width:100%;border-collapse:collapse;font-size:.95rem}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.03em}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto}

/* ---- Suivi ---- */
.line{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
.line .row{margin-top:8px}

/* ---- Toast ---- */
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:90vw;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#toast.on{display:block}

/* ---- Rapport imprimable ---- */
#print-root{display:none}
.rp{font:11pt/1.45 var(--font);color:#111}
.rp h1{font-size:20pt;margin:0 0 2pt;color:var(--brand)} .rp h2{font-size:13pt;margin:14pt 0 5pt;color:var(--brand);border-bottom:2px solid var(--brand);padding-bottom:2pt;break-after:avoid}
.rp .hd{display:flex;gap:12pt;align-items:center;border-bottom:3px solid var(--brand);padding-bottom:8pt;margin-bottom:8pt}
.rp .hd img,.rp .hd svg{width:64pt;height:64pt;object-fit:contain}
.rp .hd .who{flex:1} .rp .hd .who b{font-size:13pt}
.rp .meta{display:grid;grid-template-columns:1fr 1fr;gap:2pt 14pt;margin:6pt 0}
.rp .disc{font-size:10pt;margin:8pt 0;padding:7pt 10pt}
.rp table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-top:4pt}
.rp th,.rp td{border:1px solid #94A3B8;padding:4pt 5pt;vertical-align:top;text-align:left}
.rp th{background:#E3F1F3} .rp tr{break-inside:avoid}
.rp td.r,.rp th.r{text-align:right;white-space:nowrap}
.rp ul{margin:2pt 0 4pt;padding-left:16pt}
.rp .tot{font-size:14pt;font-weight:800;color:var(--brand)}
.rp .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6pt}
.rp .photos figure{margin:0;break-inside:avoid;font-size:8.5pt}
.rp .photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.rp .foot{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 18mm}
  html,body{background:#fff!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp .foot{display:block;position:fixed;bottom:-12mm;left:0;right:0;text-align:center;font-size:8pt;color:#334155;border-top:1px solid #94A3B8;padding-top:3pt}
}

/* ---- Responsive ---- */
@media (min-width:768px){
  main{max-width:900px;padding-top:20px}
  .list{grid-template-columns:1fr 1fr}
  .rooms{margin-inline:0;padding-inline:0}
  .dock{margin-inline:0;border-radius:var(--r) var(--r) 0 0}
}
@media (min-width:1024px){
  main{max-width:1100px}
  .list{grid-template-columns:1fr 1fr 1fr}
  .room-layout{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
  .rooms{flex-direction:column;overflow:visible;position:sticky;top:84px}
  .chip{justify-content:space-between;border-radius:12px}
  .dock{max-width:560px;margin-inline:auto;border-radius:var(--r) var(--r) 0 0}
}
@media (max-width:420px){ .two{grid-template-columns:1fr} .sumbar b{font-size:1.2rem} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="gal" type="file" accept="image/*" multiple hidden>
<input id="logofile" type="file" accept="image/*" hidden>
<input id="importfile" type="file" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   Données de référence
   ========================================================= */
const ROOMS = [
  {k:'infos',l:'Général'},{k:'salon',l:'Salon'},{k:'cuisine',l:'Cuisine'},{k:'chambres',l:'Chambres'},
  {k:'combles',l:'Combles'},{k:'toiture',l:'Toiture'},{k:'murs',l:'Murs'},{k:'sols',l:'Sols'},
  {k:'chauffage',l:'Chauffage'},{k:'ventilation',l:'Ventilation'},{k:'exterieur',l:'Extérieur'}
];
const POSTES = [
  {cle:'fenetres',label:'Fenêtres et menuiseries'},{cle:'combles',label:'Isolation toiture / combles'},
  {cle:'murs',label:'Murs'},{cle:'sols',label:'Sols'},{cle:'chauffage',label:'Chauffage / pompe à chaleur'},
  {cle:'ventilation',label:'Ventilation / VMC'},{cle:'eclairage',label:'Éclairage LED'},
  {cle:'humidite',label:'Humidité / état du bâti visible'}
];
const STATUTS = {en_visite:'En visite',diag_pret:'Diagnostic prêt',envoye:'Envoyé à l’acheteur',travaux:'Travaux en cours',clos:'Clos'};
const PRIO = {urgent:'Urgent',important:'Important',confort:'Confort',non_evalue:'Non évalué'};
const PAY = {a_facturer:'À facturer',facturee:'Facturée',payee:'Payée'};
const DISCLAIMER = 'Avis indicatif non réglementaire : ce document n’est ni un DPE ni un audit énergétique. Les constats et fourchettes de prix sont indicatifs et à confirmer par un professionnel RGE.';

/* Grille de prix par défaut — France, TTC, pose comprise, ordres de grandeur indicatifs */
const DEFAULT_GRID = [
  {id:'fenetre',label:'Fenêtre double vitrage (pose comprise)',unite:'fenêtre',min:600,max:1300},
  {id:'baie',label:'Porte-fenêtre / baie vitrée',unite:'unité',min:1000,max:2500},
  {id:'porte',label:'Porte d’entrée isolante',unite:'unité',min:1500,max:3500},
  {id:'combles_perdus',label:'Isolation combles perdus (soufflage / rouleaux)',unite:'m²',min:20,max:50},
  {id:'rampants',label:'Isolation rampants / combles aménagés',unite:'m²',min:45,max:100},
  {id:'toiture',label:'Isolation toiture par l’extérieur (sarking)',unite:'m²',min:150,max:280},
  {id:'toiture_rep',label:'Réparation / réfection de toiture',unite:'m²',min:90,max:250},
  {id:'murs_iti',label:'Isolation des murs par l’intérieur',unite:'m²',min:45,max:110},
  {id:'murs_ite',label:'Isolation des murs par l’extérieur',unite:'m²',min:120,max:220},
  {id:'plancher_bas',label:'Isolation plancher bas (sous-sol, vide sanitaire)',unite:'m²',min:25,max:70},
  {id:'pac_eau',label:'Pompe à chaleur air/eau (pose comprise)',unite:'unité',min:11000,max:18000},
  {id:'pac_air',label:'Pompe à chaleur air/air (multisplit)',unite:'unité',min:3500,max:9000},
  {id:'chaudiere',label:'Chaudière gaz à condensation',unite:'unité',min:3500,max:7500},
  {id:'cet',label:'Chauffe-eau thermodynamique',unite:'unité',min:2500,max:4500},
  {id:'vmc_simple',label:'VMC simple flux hygroréglable',unite:'logement',min:1200,max:3000},
  {id:'vmc_double',label:'VMC double flux',unite:'logement',min:4500,max:9500},
  {id:'led',label:'Éclairage LED (ampoules / spots)',unite:'point',min:8,max:40},
  {id:'humidite',label:'Traitement humidité (remontées, drainage)',unite:'ml',min:80,max:250},
  {id:'audit',label:'Audit énergétique par un professionnel certifié',unite:'forfait',min:800,max:1500}
];
const DEFAULT_SETTINGS = {
  profile:{name:'Jordan',tagline:'Coordinateur énergie — accompagnement d’acheteurs',phone:'',email:'',siret:''},
  logo:null, workerUrl:'', token:'', visitFee:250, commissionRate:8,
  grid:DEFAULT_GRID
};

/* =========================================================
   Utilitaires
   ========================================================= */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const eur = n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const eur2 = n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const today = ()=>new Date().toISOString().slice(0,10);
const fdate = d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
const num = v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const roomLabel = k=>(ROOMS.find(r=>r.k===k)||{l:k}).l;

const ICONS = {
  mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  plus:'<path d="M5 12h14M12 5v14"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  doc:'<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',

const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false, micFatal=false, micRoom=null;
function syncMic(){
  const b=$('#micbtn'); if(!b) return;
  b.setAttribute('aria-pressed',String(listening));
  b.innerHTML=(listening?ic('stop'):ic('mic'))+`<span>${listening?'Arrêter':'Dicter'}</span>`;
  const m=$('#micstate'); if(m){m.classList.toggle('live',listening);m.textContent=listening?'● J’écoute… parlez, puis touchez « Arrêter ».':(SR?'':'Dictée indisponible sur ce navigateur : utilisez le micro du clavier.')}
}
function appendNote(text){
  const k=micRoom||S.room; text=text.trim(); if(!text) return;
  text=text.charAt(0).toUpperCase()+text.slice(1);
  const cur=S.v.notes[k]||'';
  S.v.notes[k]=cur+(cur&&!/\n$/.test(cur)?'\n':'')+text;
  const t=$('#notes'); if(t&&S.room===k){t.value=S.v.notes[k];autosize(t);t.scrollTop=t.scrollHeight}
  touch();
}
function startMic(){
  if(!SR){toast('Dictée non disponible ici : utilisez le micro du clavier du téléphone.',4500);return}
  micFatal=false; micRoom=S.room;
  rec=new SR(); rec.lang='fr-FR'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) appendNote(r[0].transcript); else interim+=r[0].transcript;
    }
    const el=$('#interim'); if(el) el.textContent=interim;
  };
  rec.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted') return;
    micFatal=true;
    toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Micro refusé : autorisez-le dans les réglages du navigateur.'
      :e.error==='network'?'La dictée nécessite une connexion. Utilisez le micro du clavier hors ligne.':'Erreur de dictée : '+e.error,5000);
  };
  rec.onend=()=>{
    const el=$('#interim'); if(el) el.textContent='';
    if(listening&&!micFatal){try{rec.start();return}catch{}}
    listening=false; syncMic();
  };
  try{rec.start();listening=true}catch{listening=false}
  syncMic();
}
function stopMic(){
  if(!listening&&!rec) return;
  listening=false;
  try{rec&&rec.stop()}catch{}
  rec=null; syncMic();
}

/* ---- Photos ---- */
async function shrink(file,max=1280,q=.75){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch{
    bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  }
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight, k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));
}
async function addPhotos(files){
  if(!S.v||!files.length) return;
  let n=0;
  for(const f of files){

      const p={id:uid(),visitId:S.v.id,room:S.room,caption:'',blob,ts:Date.now()+n};
      await DB.put('photos',p); S.photos.push(p); n++;
    }catch(e){toast('Photo non enregistrée : '+(e.message||'erreur'))}
  }
  if(n){S.v.updatedAt=Date.now();flush();toast(n+' photo'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''));renderTab()}
}

function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
async function buildPayload(){
  const v=S.v, s=S.settings;
  const cp=(v.address.match(/\b\d{5}\b/)||[''])[0];
  let ph=[...S.photos].sort((a,b)=>a.ts-b.ts);
  if(ph.length>24){const step=ph.length/24;ph=Array.from({length:24},(_,i)=>ph[Math.floor(i*step)])}
  const photos=[];
  for(const p of ph) photos.push({piece:roomLabel(p.room),legende:p.caption||'',media_type:'image/jpeg',data:await blobToB64(p.blob)});
  return {
    bien:{code_postal:cp,surface:num(v.surface),annee:String(v.year||''),dpe_annonce:v.dpe||''},
    pieces:ROOMS.map(r=>({cle:r.k,label:r.l,notes:v.notes[r.k]||''})).filter(p=>p.notes.trim()),
    photos,
    grille:s.grid.map(g=>({id:g.id,label:g.label,unite:g.unite,min:num(g.min),max:num(g.max)}))
  };
}
function normalizeDiag(d){
  const grid=Object.fromEntries(S.settings.grid.map(g=>[g.id,g]));
  const postes=POSTES.map(def=>{
    const src=(d.postes||[]).find(p=>p.cle===def.cle)||{};
    let min=0,max=0; const hyp=[];
    (src.lignes||[]).forEach(l=>{
      const g=grid[l.grille_id], q=num(l.quantite);
      if(g){ min+=q*num(g.min); max+=q*num(g.max);
        hyp.push(`${l.libelle||g.label} : ${q} ${l.unite||g.unite} × ${eur(num(g.min))}–${eur(num(g.max))}/${g.unite}${l.hypothese?' ('+l.hypothese+')':''}`); }
      else { min+=num(l.prix_min); max+=num(l.prix_max);
        hyp.push(`${l.libelle||'Poste'} : estimation hors grille ${eur(num(l.prix_min))}–${eur(num(l.prix_max))}${l.hypothese?' ('+l.hypothese+')':''}`); }
    });
    const prio=PRIO[src.priorite]?src.priorite:'non_evalue';
    min=Math.round(min); max=Math.round(max);
    return {cle:def.cle,label:def.label,constat:src.constat||'Non renseigné pendant la visite — à vérifier.',priorite:prio,
      travaux:src.travaux||'',gain:Math.min(5,Math.max(1,Math.round(num(src.gain))||1)),min,max,hypotheses:hyp.join('\n'),incluse:prio!=='non_evalue'&&max>0};
  });
  return {generatedAt:Date.now(),synthese:d.synthese||'',points_forts:d.points_forts||[],points_faibles:d.points_faibles||[],postes,questions:d.questions||[]};
}
async function generate(){
  const s=S.settings, v=S.v;
  if(!s.workerUrl||!s.token){toast('Renseignez d’abord l’adresse du proxy et le jeton dans les Réglages.',4500);return}
  if(!navigator.onLine){toast('Connexion nécessaire pour générer le diagnostic.');return}
  if(!Object.values(v.notes).some(t=>(t||'').trim())&&!S.photos.length){toast('Ajoutez au moins des notes ou des photos.');return}
  if(v.diag&&!confirm('Régénérer remplacera le diagnostic actuel, y compris vos modifications. Continuer ?')) return;
  await flush(); S.busy=true; S.err=''; renderTab();
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),5*60*1000);
  try{
    const res=await fetch(s.workerUrl.replace(/\/+$/,'')+'/diagnostic',{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','X-App-Token':s.token},body:JSON.stringify(await buildPayload())});
    const txt=(await res.text()).trim(); let data;
    try{data=JSON.parse(txt)}catch{throw new Error('Réponse illisible du proxy (HTTP '+res.status+').')}
    if(!res.ok||!data.ok) throw new Error(data.error||'Erreur HTTP '+res.status);
    v.diag=normalizeDiag(data.diagnostic);
    if(v.status==='en_visite') v.status='diag_pret';
    touch(); await flush();
  }catch(e){
    S.err=e.name==='AbortError'?'Délai dépassé : réessayez.':(e.message==='Failed to fetch'?'Proxy injoignable : vérifiez l’adresse du Worker et votre connexion.':e.message);
  }finally{clearTimeout(to);S.busy=false;renderTab()}
}

/* ---- Calculs budget ---- */
const avg = p=>(num(p.min)+num(p.max))/2;
function totals(d){
  const t={min:0,max:0,by:{urgent:[0,0],important:[0,0],confort:[0,0]}};
  d.postes.filter(p=>p.incluse).forEach(p=>{t.min+=num(p.min);t.max+=num(p.max);const b=t.by[p.priorite];if(b){b[0]+=num(p.min);b[1]+=num(p.max)}});
  return t;
}
function ranking(d){return d.postes.filter(p=>p.incluse&&avg(p)>0).map(p=>({p,score:(num(p.gain)||1)/avg(p)*1000})).sort((a,b)=>b.score-a.score)}
const range = p=>num(p.max)>0?`${eur(p.min)} – ${eur(p.max)}`:'—';

function sumHTML(d){
  const t=totals(d), rk=ranking(d);
  return `<div class="card"><h2>Budget total estimé</h2>
    <p class="big">${eur(t.min)} – ${eur(t.max)}</p>
    <p class="hint">Fourchette indicative, hors aides, à confirmer par des devis d’artisans RGE.</p>

async function printReport(){

async function exportAll(){
  const photos=[];
  for(const v of S.visits) for(const p of await DB.photosOf(v.id)) photos.push({...p,blob:undefined,data:await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(p.blob)})});
  const blob=new Blob([JSON.stringify({app:'visite-energie',version:1,exportedAt:Date.now(),settings:{...S.settings,token:''},visits:S.visits,photos})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sauvegarde-visite-energie-'+today()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
async function importAll(file){
  try{
    const d=JSON.parse(await file.text());
    if(d.app!=='visite-energie') throw new Error('Fichier non reconnu');
    for(const v of d.visits||[]){await DB.put('visits',v);const i=S.visits.findIndex(x=>x.id===v.id);if(i>=0)S.visits[i]=v;else S.visits.push(v)}
    for(const p of d.photos||[]){const {data,...rest}=p;await DB.put('photos',{...rest,blob:await (await fetch(data)).blob()})}
    if(d.settings){S.settings=mergeSettings({...d.settings,token:S.settings.token,workerUrl:d.settings.workerUrl||S.settings.workerUrl});saveSettings()}
    toast('Sauvegarde importée'); route();
  }catch(e){toast('Import impossible : '+e.message)}
}

    catch{toast('Proxy injoignable (adresse ou réseau).')}
  },
  export:exportAll, import(){$('#importfile').click()},
  async install(){if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;const b=$('#instbtn');if(b)b.hidden=true}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const f=A[el.dataset.a]; if(f) f(el);
});

function readVal(el){
  if(el.type==='checkbox') return el.checked;
  if(el.dataset.t==='num') return num(el.value);
  if(el.dataset.t==='lines') return el.value.split('\n');
  return el.value;
}
let capT;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.tagName==='TEXTAREA'&&el.classList.contains('auto')) autosize(el);
  if(el.dataset.b){
    if(!S.v) return;
    setPath(S.v,el.dataset.b,readVal(el)); touch(); afterBind(el.dataset.b);
  }else if(el.dataset.s){
    setPath(S.settings,el.dataset.s,readVal(el)); saveSettings();
  }else if(el.dataset.g){
    const [i,f]=el.dataset.g.split('.'); S.settings.grid[+i][f]=readVal(el); saveSettings();
  }else if(el.dataset.pc){
    const p=S.photos.find(x=>x.id===el.dataset.pc); if(!p) return;
    p.caption=el.value; clearTimeout(capT); capT=setTimeout(()=>DB.put('photos',p),400);
  }else if(el.id==='withph'){ S.withPhotos=el.checked }
});
function afterBind(path){
  if(path==='address'||path==='buyer'){const h=$('#htitle');if(h)h.textContent=S.v.address||'Nouvelle visite'}
  let m=path.match(/^diag\.postes\.(\d+)\./);
  if(m){
    const i=+m[1], p=S.v.diag.postes[i];
    const r=$(`[data-sumrange="${i}"]`); if(r) r.textContent=range(p);
    const pr=$(`[data-sumprio="${i}"]`); if(pr){pr.textContent=PRIO[p.priorite];pr.className='pill '+p.priorite}
    const s=$('#diag-sum'); if(s) s.innerHTML=sumHTML(S.v.diag);
  }
  if(path.startsWith('suivi.')||path==='commissionRate'){
    const s=$('#suivi-sum'); if(s) s.innerHTML=suiviSum(S.v);
    $$('[data-com]').forEach(i=>{i.value=eur2(commissionOf(S.v.suivi.works[+i.dataset.com],S.v))});
  }
}
$('#cam').addEventListener('change',e=>{addPhotos([...e.target.files]);e.target.value=''});
$('#gal').addEventListener('change',e=>{addPhotos([...e.target.files]);e.target.value=''});
$('#importfile').addEventListener('change',e=>{if(e.target.files[0])importAll(e.target.files[0]);e.target.value=''});
$('#logofile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const bmp=await createImageBitmap(f), k=Math.min(1,480/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    S.settings.logo=c.toDataURL('image/png'); saveSettings(); viewSettings(); toast('Logo enregistré');
  }catch{toast('Logo illisible')}
});
window.addEventListener('online',()=>route());
window.addEventListener('offline',()=>route());

/* =========================================================
   Démarrage
   ========================================================= */
(async function init(){
  try{
    await DB.open();
    S.settings=mergeSettings(await DB.get('kv','settings'));
    S.visits=await DB.all('visits');
    navigator.storage?.persist?.();
  }catch(e){
    app.innerHTML='<main><div class="err">Stockage local indisponible (navigation privée ?). L’application ne peut pas enregistrer vos visites.</div></main>';
    return;
  }
  window.addEventListener('hashchange',route);
  route();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
